<!doctype html>
<html><head><meta charset="utf-8"><title>render</title></head>
<body>
<script src="../app/src/main/assets/engine.js"></script>
<script>
// Offline render harness: runs the real engine inside Chromium's OfflineAudioContext,
// calling tick() every 0.25 s of audio time, the same as the app does.
async function render({ seconds, sampleRate, state, script, wav }) {
  const ctx = new OfflineAudioContext(2, Math.floor(seconds * sampleRate), sampleRate);
  const errors = [];
  const eng = new Lullabyrinth.Engine(ctx, { useInterval: false, state });
  const events = (script || []).slice().sort((a, b) => a.t - b.t);
  const step = t => {
    try {
      while (events.length && events[0].t <= t + 1e-6) {
        const e = events.shift();
        if (e.call === 'setMacro') eng.setMacro(e.k, e.v);
        else eng[e.call](...(e.args || []));
      }
      eng.tick();
    } catch (err) { errors.push(`${t.toFixed(2)}s: ${err && err.message}`); }
  };
  for (let t = .25; t < seconds - .1; t += .25) {
    ctx.suspend(t).then(() => { step(ctx.currentTime); ctx.resume(); });
  }
  try { eng.startAt(0); } catch (err) { errors.push('start: ' + err.message); }
  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let peak = 0, nan = 0;
  const win = sampleRate * 5, rms = [];
  for (let i = 0; i < L.length; i += win) {
    let s = 0, n = 0;
    for (let j = i; j < Math.min(L.length, i + win); j++) {
      const a = L[j], b = R[j];
      if (!isFinite(a) || !isFinite(b)) { nan++; continue; }
      s += a * a + b * b; n += 2;
      const m = Math.max(Math.abs(a), Math.abs(b)); if (m > peak) peak = m;
    }
    rms.push(+(20 * Math.log10(Math.sqrt(s / Math.max(1, n)) + 1e-9)).toFixed(1));
  }
  const out = { peak: +peak.toFixed(3), peakDb: +(20 * Math.log10(peak + 1e-9)).toFixed(1), nan, rms5s: rms, errors, final: eng.state };
  if (wav) {
    const n = L.length, data = new DataView(new ArrayBuffer(44 + n * 4));
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) data.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); data.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt ');
    data.setUint32(16, 16, true); data.setUint16(20, 1, true); data.setUint16(22, 2, true);
    data.setUint32(24, sampleRate, true); data.setUint32(28, sampleRate * 4, true);
    data.setUint16(32, 4, true); data.setUint16(34, 16, true); ws(36, 'data'); data.setUint32(40, n * 4, true);
    for (let i = 0; i < n; i++) {
      data.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true);
      data.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true);
    }
    const bytes = new Uint8Array(data.buffer); let bin = '';
    for (let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
    out.wav = btoa(bin);
  }
  return out;
}
window.render = render;
window.ready = true;
</script>
</body></html>
