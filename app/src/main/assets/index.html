<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lullabyrinth</title>
<style>
  :root {
    --bg: #06050d; --ink: #ece7ff; --dim: rgba(236,231,255,.56); --faint: rgba(236,231,255,.16);
    --h: 235;
    --serif: 'Noto Serif', 'Droid Serif', Georgia, serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: system-ui, Roboto, 'Google Sans', sans-serif; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: auto; }

  main { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; padding: 18px 16px 18px; }
  header { text-align: center; padding-top: 6px; }
  .brand { font-size: 10.5px; letter-spacing: .55em; color: var(--dim); padding-left: .55em; }
  h1 { font-family: var(--serif); font-style: italic; font-weight: 400; margin: 12px 0 6px;
    font-size: clamp(25px, 7.4vw, 42px); line-height: 1.12;
    text-shadow: 0 0 26px hsla(var(--h), 80%, 70%, .5); transition: text-shadow 3s; }
  #meta { font-size: 13px; color: var(--dim); letter-spacing: .08em; }

  #center { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .orb { width: 138px; height: 138px; border-radius: 50%; border: 1px solid hsla(var(--h), 60%, 82%, .32);
    background: radial-gradient(circle at 50% 38%, hsla(var(--h), 70%, 72%, .26), hsla(var(--h), 60%, 32%, .08) 62%, transparent 72%);
    box-shadow: 0 0 46px hsla(var(--h), 70%, 60%, .22), inset 0 0 30px hsla(var(--h), 70%, 70%, .1);
    font-size: 14px; letter-spacing: .38em; padding-left: .38em; text-transform: lowercase; transition: transform .3s; }
  .orb:active { transform: scale(.96); }
  body.playing .orb { animation: breathe 9s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 40px hsla(var(--h),70%,60%,.18); } 50% { box-shadow: 0 0 78px hsla(var(--h),75%,65%,.42); } }
  #actions { display: flex; gap: 12px; }
  .pill { border: 1px solid var(--faint); background: rgba(255,255,255,.045); border-radius: 999px;
    padding: 10px 18px; font-size: 13.5px; letter-spacing: .14em; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .pill:active { background: hsla(var(--h), 60%, 50%, .25); }

  #knobs { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 560px; gap: 2px; }
  @media (max-width: 360px) { #knobs { grid-template-columns: repeat(3, 1fr); row-gap: 12px; } }
  .knob { display: flex; flex-direction: column; align-items: center; touch-action: none; }
  .knob svg { width: min(18vw, 86px); height: auto; overflow: visible; }
  .kbody { fill: rgba(255,255,255,.035); stroke: rgba(255,255,255,.08); }
  .ktrack { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 3.2; stroke-linecap: round; }
  .kval { fill: none; stroke: hsla(var(--h), 80%, 76%, .95); stroke-width: 3.2; stroke-linecap: round;
    filter: drop-shadow(0 0 4px hsla(var(--h), 90%, 70%, .7)); }
  .kptr { stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; opacity: .85; }
  .klive { fill: #fff; filter: drop-shadow(0 0 4px hsla(var(--h), 90%, 80%, 1)); transition: opacity 1s; }
  body:not(.dreaming) .klive { opacity: 0; }
  .knob.active .kbody { fill: hsla(var(--h), 60%, 50%, .16); }
  .kname { font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; margin-top: 3px; white-space: nowrap; }
  .ksub { font-size: 10.5px; color: var(--dim); font-style: italic; font-family: var(--serif); white-space: nowrap; }
  #hint { min-height: 38px; max-width: 360px; text-align: center; font-family: var(--serif); font-style: italic;
    font-size: 13.5px; color: var(--dim); transition: opacity .6s; padding: 4px 8px; }

  #sleep { width: 100%; max-width: 560px; }
  .rowlbl { font-size: 11px; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; margin: 0 0 6px 4px; }
  .rowlbl b { font-weight: 400; color: var(--ink); letter-spacing: .08em; text-transform: none; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 3px 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips.wrap { flex-wrap: wrap; overflow: visible; }
  .chip { flex: none; border: 1px solid var(--faint); border-radius: 999px; padding: 8px 13px; font-size: 13px;
    color: var(--dim); background: transparent; transition: all .3s; }
  .chip.on { color: var(--ink); border-color: hsla(var(--h), 70%, 76%, .7); background: hsla(var(--h), 60%, 50%, .2); }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }

  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 84%; overflow-y: auto; z-index: 5;
    background: rgba(13, 11, 26, .95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 22px 22px 0 0; border-top: 1px solid var(--faint);
    transform: translateY(105%); transition: transform .42s cubic-bezier(.2,.8,.2,1); padding: 10px 18px 24px; }
  .sheet.open { transform: none; }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--faint); margin: 2px auto 10px; }
  .sec { margin: 14px 0 6px; }
  .sechead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .sechead span { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
  .hold { border: 1px solid var(--faint); background: none; border-radius: 999px; font-size: 11px; padding: 4px 10px;
    color: var(--dim); letter-spacing: .1em; }
  .hold.on { color: var(--ink); border-color: hsla(var(--h), 70%, 76%, .7); }
  .toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 2px;
    border-top: 1px solid rgba(255,255,255,.06); font-size: 14px; }
  .toggle small { display: block; color: var(--dim); font-size: 12px; font-family: var(--serif); font-style: italic; margin-top: 2px; }
  .sw { width: 46px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.12); position: relative; flex: none; border: 0; transition: background .3s; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #cfc8ea; transition: transform .3s; }
  .sw.on { background: hsla(var(--h), 60%, 55%, .7); }
  .sw.on::after { transform: translateX(20px); background: #fff; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; margin-top: -9px;
    background: #fff; box-shadow: 0 0 12px hsla(var(--h), 90%, 70%, .9); }
  .done { width: 100%; margin-top: 16px; }

  #veil { position: fixed; inset: 0; z-index: 10; background: #000; opacity: 0; pointer-events: none; transition: opacity 5s;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 70px;
    color: rgba(255,255,255,.1); font-size: 11px; letter-spacing: .4em; }
  #veil.on { opacity: .97; pointer-events: auto; }
  #veil .ember { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%;
    background: hsla(var(--h), 70%, 70%, .35); animation: ember 9s ease-in-out infinite; }
  @keyframes ember { 0%,100% { opacity: .15; transform: scale(1); } 50% { opacity: .6; transform: scale(1.8); } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main>
  <header>
    <div class="brand">LULLABYRINTH</div>
    <h1 id="name">The Lantern Orrery</h1>
    <div id="meta"></div>
  </header>
  <div id="center">
    <button id="play" class="orb">begin</button>
    <div id="actions">
      <button id="conjure" class="pill">✶ conjure</button>
      <button id="tune" class="pill">tuning</button>
    </div>
  </div>
  <section id="knobs"></section>
  <div id="hint"></div>
  <section id="sleep">
    <div class="rowlbl">drift off after <b id="remain"></b></div>
    <div class="chips" id="sleepChips"></div>
  </section>
</main>

<div id="sheet" class="sheet">
  <div class="grab"></div>
  <div class="sec"><div class="sechead"><span>Key</span><button class="hold" data-lock="root">hold on conjure</button></div><div class="chips wrap" id="keys"></div></div>
  <div class="sec"><div class="sechead"><span>Scale</span><button class="hold" data-lock="scale">hold on conjure</button></div><div class="chips wrap" id="scales"></div></div>
  <div class="sec"><div class="sechead"><span>Style</span><button class="hold" data-lock="style">hold on conjure</button></div><div class="chips wrap" id="styles"></div></div>
  <div class="sec" style="margin-top:18px">
    <div class="toggle"><div>Let the knobs dream<small>each knob slowly wanders around where you set it</small></div><button class="sw" id="swDream"></button></div>
    <div class="toggle"><div>Wandering keys<small>every 10–25 minutes, drift to a neighboring key or mode</small></div><button class="sw" id="swWander"></button></div>
    <div class="toggle"><div>Hold knobs on conjure<small>conjure keeps your knob settings</small></div><button class="sw" id="swKnobs"></button></div>
    <div class="toggle" style="display:block"><div>Volume</div><input type="range" id="volume" min="0" max="1" step="0.01"></div>
  </div>
  <button class="pill done" id="closeSheet">done</button>
</div>

<div id="veil"><div class="ember"></div>touch to wake</div>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  const { Engine, SCALES, STYLES, MACROS, NOTE_NAMES } = window.Lullabyrinth;
  const AB = window.Android || null;
  const $ = s => document.querySelector(s);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const call = (fn, ...a) => { try { if (AB && AB[fn]) return AB[fn](...a); } catch (e) {} };

  function load() {
    try {
      const raw = (AB && AB.load) ? AB.load() : localStorage.getItem('lullabyrinth');
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  const saved = load();
  const locks = Object.assign({ root: false, scale: false, style: false, knobs: false }, saved.locks || {});
  let sleepMin = saved.sleepMin || 0;
  let saveT;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      const data = JSON.stringify({ state: eng.state, locks, sleepMin });
      try { if (AB && AB.save) AB.save(data); else localStorage.setItem('lullabyrinth', data); } catch (e) {}
    }, 400);
  }

  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx({ latencyHint: 'playback' });
  if (ctx.state === 'running') ctx.suspend();
  let playing = false;
  const eng = new Engine(ctx, {
    state: saved.state,
    onChange: () => { render(); save(); if (playing) call('setPlaying', true, eng.state.name); },
    onSleepEnd: () => rest(true),
  });

  /* ---------- knobs ---------- */
  const knobs = {};
  const polar = (v, r) => { const a = (135 + 270 * v) * Math.PI / 180; return [40 + r * Math.cos(a), 40 + r * Math.sin(a)]; };
  function arc(v) {
    if (v < .003) return '';
    const [x0, y0] = polar(0, 34), [x1, y1] = polar(v, 34);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)} A34 34 0 ${v * 270 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  }
  const lastTap = {};
  let hintT;
  function hint(text, ms) {
    const h = $('#hint'); h.textContent = text; h.style.opacity = 1;
    clearTimeout(hintT); hintT = setTimeout(() => h.style.opacity = 0, ms || 2200);
  }
  MACROS.forEach(m => {
    const el = document.createElement('div');
    el.className = 'knob';
    el.innerHTML = `<svg viewBox="0 0 80 80"><circle class="kbody" cx="40" cy="40" r="26"/>
      <path class="ktrack" d="${arc(.9999)}"/><path class="kval"/><line class="kptr" x1="40" y1="40" x2="40" y2="20"/>
      <circle class="klive" r="3" cx="40" cy="6"/></svg>
      <div class="kname">${m.name}</div><div class="ksub">${m.sub}</div>`;
    $('#knobs').appendChild(el);
    knobs[m.k] = { el, val: el.querySelector('.kval'), ptr: el.querySelector('.kptr'), live: el.querySelector('.klive') };
    let drag = null;
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      drag = { x: e.clientX, y: e.clientY, v: eng.state.macros[m.k], moved: false };
      el.classList.add('active');
    });
    el.addEventListener('pointermove', e => {
      if (!drag) return;
      const dv = ((drag.y - e.clientY) + (e.clientX - drag.x) * .5) / 210;
      if (Math.abs(dv) > .012) drag.moved = true;
      if (!drag.moved) return;
      eng.setMacro(m.k, clamp(drag.v + dv, 0, 1));
      renderKnob(m.k);
      hint(`${m.name} · ${Math.round(eng.state.macros[m.k] * 100)}`, 1500);
    });
    const end = () => {
      if (!drag) return;
      el.classList.remove('active');
      if (!drag.moved) {
        const now = performance.now();
        if (now - (lastTap[m.k] || 0) < 350) { eng.setMacro(m.k, m.def); renderKnob(m.k); hint(`${m.name} reset`, 1500); }
        else hint(`${m.name} — ${m.hint}`, 4200);
        lastTap[m.k] = now;
      }
      drag = null;
      save();
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });
  function renderKnob(k) {
    const v = eng.state.macros[k], kn = knobs[k];
    kn.val.setAttribute('d', arc(v));
    const [x1, y1] = polar(v, 13), [x2, y2] = polar(v, 23);
    kn.ptr.setAttribute('x1', x1); kn.ptr.setAttribute('y1', y1); kn.ptr.setAttribute('x2', x2); kn.ptr.setAttribute('y2', y2);
  }

  /* ---------- chips ---------- */
  function chipRow(container, items, isOn, onPick, deco) {
    container.innerHTML = '';
    items.forEach(it => {
      const b = document.createElement('button');
      b.className = 'chip' + (isOn(it.v) ? ' on' : '');
      b.innerHTML = (deco ? deco(it.v) : '') + it.label;
      b.onclick = () => onPick(it.v);
      container.appendChild(b);
    });
  }
  const SLEEPS = [[0, '∞'], [15, '15m'], [30, '30m'], [45, '45m'], [60, '1h'], [90, '1½h'], [120, '2h'], [180, '3h'], [300, '5h']];
  function renderSleep() {
    chipRow($('#sleepChips'), SLEEPS.map(([v, label]) => ({ v, label })), v => v === sleepMin, v => {
      sleepMin = v;
      if (playing) eng.setSleep(v);
      renderSleep(); updateRemain(); save();
      hint(v ? `Fades out gently over the last ${Math.round(Math.min(v * .4, 10))} minutes` : 'Plays until you stop it', 2600);
    });
  }
  function updateRemain() {
    const r = playing ? eng.sleepRemaining() : 0;
    $('#remain').textContent = r > 0 ? `· ${Math.ceil(r / 60)} min left` : '';
  }
  setInterval(updateRemain, 5000);

  function renderSheet() {
    const s = eng.state;
    chipRow($('#keys'), NOTE_NAMES.map((n, i) => ({ v: i, label: n })), v => v === s.root, v => eng.setRoot(v));
    chipRow($('#scales'), Object.keys(SCALES).map(n => ({ v: n, label: n })), v => v === s.scale, v => eng.setScale(v));
    chipRow($('#styles'), Object.keys(STYLES).map(n => ({ v: n, label: n })), v => v === s.style, v => eng.setStyle(v),
      v => `<span class="dot" style="background:hsl(${STYLES[v].hue[0]},65%,62%)"></span>`);
    document.querySelectorAll('.hold').forEach(b => b.classList.toggle('on', !!locks[b.dataset.lock]));
    $('#swDream').classList.toggle('on', !!s.dream);
    $('#swWander').classList.toggle('on', !!s.wander);
    $('#swKnobs').classList.toggle('on', !!locks.knobs);
    $('#volume').value = s.volume;
  }

  function render() {
    const s = eng.state;
    $('#name').textContent = s.name;
    $('#meta').textContent = `${NOTE_NAMES[s.root]} ${s.scale} · ${s.style}`;
    targetHue = (STYLES[s.style] || STYLES['Glass Cathedral']).hue;
    document.body.classList.toggle('dreaming', !!s.dream && playing);
    MACROS.forEach(m => renderKnob(m.k));
    renderSheet();
  }

  /* ---------- transport ---------- */
  async function begin() {
    await eng.start();
    if (sleepMin) eng.setSleep(sleepMin);
    playing = true;
    document.body.classList.add('playing');
    $('#play').textContent = 'rest';
    call('setPlaying', true, eng.state.name);
    render(); updateRemain(); armIdle();
  }
  function rest(fromTimer) {
    if (!fromTimer) eng.stop(4);
    playing = false;
    document.body.classList.remove('playing');
    $('#play').textContent = 'begin';
    call('setPlaying', false, '');
    render(); updateRemain();
    if (!fromTimer) wake();
  }
  $('#play').onclick = () => playing ? rest() : begin();
  $('#conjure').onclick = () => {
    eng.conjure(locks);
    hint('A new dream is taking shape…', 2600);
    if (!playing) begin();
  };
  window.LB = { remoteStop: () => { if (playing) rest(); } };

  /* ---------- sheet ---------- */
  $('#tune').onclick = () => { renderSheet(); $('#sheet').classList.add('open'); };
  $('#closeSheet').onclick = () => $('#sheet').classList.remove('open');
  document.querySelectorAll('.hold').forEach(b => b.onclick = () => { locks[b.dataset.lock] = !locks[b.dataset.lock]; renderSheet(); save(); });
  $('#swDream').onclick = () => { eng.state.dream = !eng.state.dream; render(); save(); };
  $('#swWander').onclick = () => { eng.state.wander = !eng.state.wander; render(); save(); };
  $('#swKnobs').onclick = () => { locks.knobs = !locks.knobs; renderSheet(); save(); };
  $('#volume').oninput = e => { eng.setVolume(+e.target.value); save(); };
  document.querySelector('main').addEventListener('pointerdown', e => {
    if ($('#sheet').classList.contains('open') && !e.target.closest('#sheet')) $('#sheet').classList.remove('open');
  });

  /* ---------- night veil ---------- */
  let idleT, veilOn = false;
  function armIdle() {
    clearTimeout(idleT);
    if (playing) idleT = setTimeout(() => {
      if ($('#sheet').classList.contains('open')) return armIdle();
      veilOn = true; $('#veil').classList.add('on'); call('setDim', true);
    }, 45000);
  }
  function wake() { veilOn = false; $('#veil').classList.remove('on'); call('setDim', false); armIdle(); }
  document.addEventListener('pointerdown', () => { if (!veilOn) armIdle(); }, true);
  $('#veil').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); wake(); });

  /* ---------- sky ---------- */
  const cv = $('#sky'), g = cv.getContext('2d');
  let W, H, dpr;
  function resize() { dpr = .5; // soft glows look the same at low resolution and cost far less W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; }
  addEventListener('resize', resize); resize();
  const orbs = Array.from({ length: 6 }, () => ({ a: Math.random() * 6.28, b: Math.random() * 6.28,
    sa: .00005 + Math.random() * .00007, sb: .00004 + Math.random() * .00006, r: .26 + Math.random() * .24, mix: Math.random() }));
  const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), p: Math.random() * 6.28, s: .4 + Math.random() * 1.2 }));
  let targetHue = [205, 270], hue = targetHue.slice(), lvl = 0, last = 0;
  const buf = new Uint8Array(1024);
  function frame(t) {
    requestAnimationFrame(frame);
    if (t - last < 33 || veilOn || document.hidden) return;
    last = t;
    if (playing) {
      eng.analyser.getByteTimeDomainData(buf);
      let s = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; s += v * v; }
      lvl += (Math.min(1, Math.sqrt(s / buf.length) * 5) - lvl) * .05;
    } else lvl *= .97;
    hue[0] += (targetHue[0] - hue[0]) * .02; hue[1] += (targetHue[1] - hue[1]) * .02;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#06050d'; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    const base = Math.min(W, H) * 1.15, speed = playing ? 1 : .35;
    for (const o of orbs) {
      const x = W * (.5 + .38 * Math.sin(o.a + t * o.sa * speed)), y = H * (.44 + .3 * Math.sin(o.b + t * o.sb * speed));
      const R = base * o.r * (1 + lvl * .3);
      const hh = hue[0] + (hue[1] - hue[0]) * o.mix;
      const al = .05 + .17 * lvl + (playing ? .04 : 0);
      const gr = g.createRadialGradient(x, y, 0, x, y, R);
      gr.addColorStop(0, `hsla(${hh},70%,60%,${al})`);
      gr.addColorStop(.5, `hsla(${hh},70%,42%,${al * .4})`);
      gr.addColorStop(1, `hsla(${hh},70%,30%,0)`);
      g.fillStyle = gr; g.fillRect(x - R, y - R, R * 2, R * 2);
    }
    for (const s of stars) {
      g.fillStyle = `rgba(235,230,255,${.1 + .3 * (.5 + .5 * Math.sin(s.p + t * .0007 * s.s))})`;
      g.fillRect(s.x * W, s.y * H, Math.max(1, s.s * .8), Math.max(1, s.s * .8));
    }
    document.documentElement.style.setProperty('--h', Math.round(hue[0] + (hue[1] - hue[0]) * .5));
    if (playing && eng.state.dream) for (const m of MACROS) {
      const [x, y] = polar(eng.live[m.k], 34);
      knobs[m.k].live.setAttribute('cx', x.toFixed(1)); knobs[m.k].live.setAttribute('cy', y.toFixed(1));
    }
  }
  requestAnimationFrame(frame);

  renderSleep();
  render();
  hue = targetHue.slice();
  if (!saved.state) hint('Press begin. Drag knobs up or down; tap a name to learn what it does.', 6000);
})();
</script>
