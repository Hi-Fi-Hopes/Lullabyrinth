name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install puppeteer-core
        working-directory: test
        run: npm init -y >/dev/null && npm install puppeteer-core@23
      - name: Render engine offline in Chrome
        env:
          CHROME: /usr/bin/google-chrome
        run: node test/render.mjs
      - name: Encode preview
        if: always()
        run: |
          if [ -f test/out/preview.wav ]; then
            ffmpeg -loglevel error -y -i test/out/preview.wav -codec:a libmp3lame -q:a 3 test/out/lullabyrinth-preview.mp3
          fi
          if [ -f test/out/report.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"; cat test/out/report.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-preview
          path: |
            test/out/lullabyrinth-preview.mp3
            test/out/report.txt
          if-no-files-found: ignore

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk lullabyrinth.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lullabyrinth-apk
          path: lullabyrinth.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" lullabyrinth.apk \
            --title "Lullabyrinth 1.0.${{ github.run_number }}" \
            --notes "Automated build from ${GITHUB_SHA::7}" --latest
